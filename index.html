<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Random-eyes · a digital eye configurator</title>
		<meta
			name="description"
			content="Random-eyes is an exploratory digital eye configurator: a procedural human eye, from iris fibers to lashes, rendered live in your browser. Roll a new one."
		/>
		<meta name="theme-color" content="#472718" />
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Social cards: VITE_SITE_URL (.env) makes the image URL absolute. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Random-eyes" />
		<meta property="og:title" content="Random-eyes · a digital eye configurator" />
		<meta
			property="og:description"
			content="Every eye is one of a kind. Random-eyes grows a human eye from a handful of parameters (crypts and fibers in the iris, light bending through the cornea, wet lids and lashes) and renders it live. An exploratory demo."
		/>
		<meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="A procedural human eye with an amber iris, framed by freckled skin and long lashes, inside the rings and controls of a camera-like HUD."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Random-eyes · a digital eye configurator" />
		<meta
			name="twitter:description"
			content="Every eye is one of a kind. Random-eyes grows a human eye from a handful of parameters and renders it live in your browser. An exploratory demo."
		/>
		<meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
	</head>
	<body>
		<script type="module" src="/main.js"></script>
	</body>
</html>
